name: Now in Android emulator validation

on:
  push:
    branches:
      - eval/nia-emulator-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nia-emulator-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-accessibility-instrumentation:
    name: API 34 focused Compose accessibility test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Android-brain harness
        uses: actions/checkout@v4
        with:
          path: android-brain

      - name: Checkout pinned Now in Android source
        uses: actions/checkout@v4
        with:
          repository: android/nowinandroid
          ref: a49ed253d75e61a2b6ab80a8da677b57437b08eb
          path: nowinandroid
          persist-credentials: false

      - name: Verify pinned source and apply reviewable test patch
        working-directory: nowinandroid
        run: |
          test "$(git rev-parse HEAD)" = "a49ed253d75e61a2b6ab80a8da677b57437b08eb"
          python3 - <<'PY'
          import json
          from pathlib import Path

          patch_file = Path("../android-brain/evals/fixtures/nia-emulator/NewsResourceCardTest.patch.json")
          patch = json.loads(patch_file.read_text())
          assert patch["base_commit"] == "a49ed253d75e61a2b6ab80a8da677b57437b08eb"
          documents = {}
          for operation in patch["operations"]:
              target = Path(operation["target"])
              assert not target.is_absolute() and ".." not in target.parts
              text = documents[target] if target in documents else target.read_text()
              anchor = operation["anchor"]
              assert text.count(anchor) == 1, f"patch anchor must occur exactly once: {anchor!r}"
              if operation["kind"] == "insert_after":
                  inserted = "\n".join(operation["lines"])
                  text = text.replace(anchor, anchor + "\n" + inserted, 1)
              elif operation["kind"] == "insert_before":
                  inserted = "\n".join(operation["lines"])
                  text = text.replace(anchor, inserted + "\n" + anchor, 1)
              elif operation["kind"] == "replace_once":
                  text = text.replace(anchor, operation["replacement"], 1)
              else:
                  raise ValueError(f"unsupported patch operation: {operation['kind']}")
              documents[target] = text
          for target, text in documents.items():
              target.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "core/designsystem/src/main/kotlin/com/google/samples/apps/nowinandroid/core/designsystem/component/Tag.kt
          core/ui/src/androidTest/kotlin/com/google/samples/apps/nowinandroid/core/ui/NewsResourceCardTest.kt
          core/ui/src/main/kotlin/com/google/samples/apps/nowinandroid/core/ui/NewsResourceCard.kt"
          git status --short

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Copy upstream Gradle CI configuration
        working-directory: nowinandroid
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused instrumentation test on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          script: >-
            bash -o pipefail -c 'cd nowinandroid && mkdir -p core/ui/build/outputs/logs && ./gradlew :core:ui:connectedDemoDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.google.samples.apps.nowinandroid.core.ui.NewsResourceCardTest#testTopicTagClick_exposesLocalizedDescriptionAndSendsTopicId
            --no-daemon --console=plain 2>&1 | tee core/ui/build/outputs/logs/nia-focused-instrumentation.log'

      - name: Require the focused test to appear in JUnit XML
        if: ${{ always() }}
        working-directory: nowinandroid
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          method = "testTopicTagClick_exposesLocalizedDescriptionAndSendsTopicId"
          reports = sorted(Path("core/ui/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          found = []
          for report in reports:
              root = ElementTree.parse(report).getroot()
              for case in root.iter("testcase"):
                  if case.attrib.get("name") == method and "NewsResourceCardTest" in case.attrib.get("classname", ""):
                      found.append((report, case))
          if len(found) != 1:
              raise SystemExit(f"Expected one executed {method} JUnit testcase; found {len(found)} in {len(reports)} reports")
          report, case = found[0]
          bad = [node.tag for node in case if node.tag in {"failure", "error", "skipped"}]
          if bad:
              raise SystemExit(f"{method} did not pass: {bad}; report={report}")
          print(f"PASS: {method} executed once with no failure/error/skip; XML={report}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"PASS: `{method}` executed on API 34; JUnit XML: `{report}`.\n")
          PY

      - name: Upload instrumentation results and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nia-api34-accessibility-instrumentation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            nowinandroid/core/ui/build/outputs/androidTest-results/connected/**
            nowinandroid/core/ui/build/reports/androidTests/**
            nowinandroid/core/ui/build/outputs/logs/**
